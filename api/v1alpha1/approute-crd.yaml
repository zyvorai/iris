# AppRoute CRD — experimental schema only (not installed by the Helm chart).
# Discovery today uses Service / Ingress / Gateway API / mesh annotations.
# A controller reconcile loop for AppRoute is deferred past v0.2.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: approutes.iris.zyvor.dev
  labels:
    app.kubernetes.io/name: iris
    app.kubernetes.io/component: experimental
spec:
  group: iris.zyvor.dev
  names:
    kind: AppRoute
    listKind: AppRouteList
    plural: approutes
    singular: approute
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                category:
                  type: string
                icon:
                  type: string
                backend:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    port:
                      type: integer
                    scheme:
                      type: string
                    path:
                      type: string
