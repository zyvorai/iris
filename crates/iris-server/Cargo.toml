[package]
name = "iris-server"
version = "0.1.0"
description = "Iris API server, gateway, and embedded UI"
license.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "iris-server"
path = "src/main.rs"

[dependencies]
iris-core = { path = "../iris-core" }
iris-api = { path = "../iris-api" }
iris-gateway = { path = "../iris-gateway" }
axum = { workspace = true }
axum-extra = { version = "0.10", features = ["cookie"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = "9"
rand = "0.8"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
time = "0.3"
chrono = { workspace = true }
