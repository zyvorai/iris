global:
  domain: zeus.local
  hermesPort: 31847
  publicPathPrefix: /launchpad

replicaCount: 1

image:
  controller:
    repository: ghcr.io/zyvorai/hermes-controller
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  server:
    repository: ghcr.io/zyvorai/hermes-server
    tag: "0.2.0"
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: hermes

rbac:
  create: true

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

database:
  path: /data/hermes/hermes.db

controller:
  enabled: true
  watchNamespaces: []
  autoPublish: false
  autoSuggest: true
  discoverAll: true
  discoverIngress: true
  discoverGatewayAPI: true
  discoverMesh: true
  publicBaseUrl: ""
  publicPathPrefix: ""
  healthIntervalSeconds: 30

server:
  bind: "0.0.0.0:31847"
  auth:
    mode: none
    apiKey: ""
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    existingSecret: ""
    secretKey: clientSecret
    redirectUrl: ""
  # Empty = auto-generated (random, 64 chars) on first install, preserved across upgrades
  # (see templates/session-secret.yaml). Never set this to a fixed value checked into
  # source control — it's the session-signing key, not a login credential.
  sessionSecret: ""
  defaultUser: local
  allowedNamespaces: []
  adminUsers: []
  adminGroups: []
  workspaceRules: ""
  roleRules: ""
  k8sRbac: false
  federation:
    trustHeaders: false
  llm:
    apiUrl: ""
    apiKey: ""
    existingSecret: ""
    secretKey: apiKey
    model: gpt-4o-mini
    # Set apiUrl + apiKey (or existingSecret) to enable live Zyra AI (OpenAI-compatible).

cluster:
  id: local
  name: Local cluster
  # Federated peers (JSON array). Set writeEnabled + apiKey to proxy publish/recommend.
  # federated:
  #   - id: staging
  #     name: Staging cluster
  #     url: https://hermes.staging.example
  #     writeEnabled: true
  #     apiKey: ""
  federated: []

service:
  type: NodePort
  port: 31847
  nodePort: 31847

ingress:
  enabled: false
  className: ""
  host: hermes.zeus.local
  tls:
    enabled: false
    secretName: ""

resources:
  controller:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  server:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  websocket:
    enabled: true

demoApps:
  enabled: true

networkPolicy:
  enabled: false
