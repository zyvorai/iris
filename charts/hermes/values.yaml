global:
  domain: zeus.local
  hermesPort: 31847
  publicPathPrefix: /launchpad

replicaCount: 1

image:
  controller:
    repository: ghcr.io/ssahani/hermes-controller
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  server:
    repository: ghcr.io/ssahani/hermes-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: hermes

rbac:
  create: true

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

database:
  path: /data/hermes/hermes.db

controller:
  enabled: true
  watchNamespaces: []
  autoPublish: false
  autoSuggest: true
  discoverAll: true
  discoverIngress: true
  discoverGatewayAPI: true
  publicBaseUrl: ""
  publicPathPrefix: ""
  healthIntervalSeconds: 30

server:
  bind: "0.0.0.0:31847"
  auth:
    mode: none
    apiKey: ""
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    redirectUrl: ""
  sessionSecret: ""
  defaultUser: local
  allowedNamespaces: []
  adminUsers: []
  adminGroups: []

cluster:
  id: local
  name: Local cluster

service:
  type: NodePort
  port: 31847
  nodePort: 31847

ingress:
  enabled: false
  className: ""
  host: hermes.zeus.local
  tls:
    enabled: false
    secretName: ""

resources:
  controller:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  server:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  websocket:
    enabled: true

demoApps:
  enabled: true
