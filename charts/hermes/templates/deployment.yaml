{{- $publicBase := .Values.controller.publicBaseUrl -}}
{{- if not $publicBase -}}
{{- if eq .Values.service.type "NodePort" -}}
{{- $publicBase = printf "http://%s:%v" .Values.global.domain (.Values.service.nodePort | default .Values.global.hermesPort) -}}
{{- else -}}
{{- $publicBase = printf "https://%s" .Values.ingress.host -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: controller
          image: "{{ .Values.image.controller.repository }}:{{ .Values.image.controller.tag }}"
          imagePullPolicy: {{ .Values.image.controller.pullPolicy }}
          env:
            - name: HERMES_DB_PATH
              value: {{ .Values.database.path | quote }}
            - name: HERMES_PUBLIC_BASE_URL
              value: {{ $publicBase | quote }}
            {{- $pathPrefix := .Values.controller.publicPathPrefix | default .Values.global.publicPathPrefix -}}
            {{- if $pathPrefix }}
            - name: HERMES_PUBLIC_PATH_PREFIX
              value: {{ $pathPrefix | quote }}
            {{- end }}
            - name: HERMES_AUTO_PUBLISH
              value: {{ .Values.controller.autoPublish | quote }}
            - name: HERMES_AUTO_SUGGEST
              value: {{ .Values.controller.autoSuggest | quote }}
            - name: HERMES_DISCOVER_ALL
              value: {{ .Values.controller.discoverAll | quote }}
            - name: HERMES_DISCOVER_INGRESS
              value: {{ .Values.controller.discoverIngress | quote }}
            - name: HERMES_DISCOVER_GATEWAY_API
              value: {{ .Values.controller.discoverGatewayAPI | quote }}
            - name: HERMES_DISCOVER_MESH
              value: {{ .Values.controller.discoverMesh | quote }}
            {{- if .Values.controller.watchNamespaces }}
            - name: HERMES_WATCH_NAMESPACES
              value: {{ join "," .Values.controller.watchNamespaces | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data/hermes
          resources:
            {{- toYaml .Values.resources.controller | nindent 12 }}
        - name: server
          image: "{{ .Values.image.server.repository }}:{{ .Values.image.server.tag }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.global.hermesPort }}
          env:
            - name: HERMES_BIND
              value: {{ .Values.server.bind | quote }}
            - name: HERMES_DB_PATH
              value: {{ .Values.database.path | quote }}
            - name: HERMES_DEFAULT_USER
              value: {{ .Values.server.defaultUser | quote }}
            - name: HERMES_AUTH_MODE
              value: {{ .Values.server.auth.mode | quote }}
            {{- if and (eq .Values.server.auth.mode "api_key") .Values.server.auth.apiKey }}
            - name: HERMES_API_KEY
              value: {{ .Values.server.auth.apiKey | quote }}
            {{- end }}
            {{- if .Values.server.sessionSecret }}
            - name: HERMES_SESSION_SECRET
              value: {{ .Values.server.sessionSecret | quote }}
            {{- end }}
            {{- if eq .Values.server.auth.mode "oidc" }}
            - name: HERMES_OIDC_ISSUER
              value: {{ .Values.server.auth.oidc.issuer | quote }}
            - name: HERMES_OIDC_CLIENT_ID
              value: {{ .Values.server.auth.oidc.clientId | quote }}
            - name: HERMES_OIDC_CLIENT_SECRET
              value: {{ .Values.server.auth.oidc.clientSecret | quote }}
            - name: HERMES_OIDC_REDIRECT_URL
              value: {{ .Values.server.auth.oidc.redirectUrl | quote }}
            {{- end }}
            {{- if .Values.server.allowedNamespaces }}
            - name: HERMES_ALLOWED_NAMESPACES
              value: {{ join "," .Values.server.allowedNamespaces | quote }}
            {{- end }}
            {{- if .Values.server.adminUsers }}
            - name: HERMES_ADMIN_USERS
              value: {{ join "," .Values.server.adminUsers | quote }}
            {{- end }}
            {{- if .Values.server.adminGroups }}
            - name: HERMES_ADMIN_GROUPS
              value: {{ join "," .Values.server.adminGroups | quote }}
            {{- end }}
            - name: HERMES_CLUSTER_ID
              value: {{ .Values.cluster.id | quote }}
            - name: HERMES_CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
            {{- if .Values.cluster.federated }}
            - name: HERMES_FEDERATED_CLUSTERS
              value: {{ .Values.cluster.federated | toJson | quote }}
            {{- end }}
            {{- if .Values.server.workspaceRules }}
            - name: HERMES_WORKSPACE_RULES
              value: {{ .Values.server.workspaceRules | quote }}
            {{- end }}
            {{- if .Values.server.roleRules }}
            - name: HERMES_ROLE_RULES
              value: {{ .Values.server.roleRules | quote }}
            {{- end }}
            {{- if .Values.server.k8sRbac }}
            - name: HERMES_K8S_RBAC
              value: "true"
            {{- end }}
            {{- if .Values.server.federation.trustHeaders }}
            - name: HERMES_FEDERATION_TRUST_HEADERS
              value: "true"
            {{- end }}
            {{- if .Values.server.llm.apiUrl }}
            - name: HERMES_LLM_API_URL
              value: {{ .Values.server.llm.apiUrl | quote }}
            {{- end }}
            {{- if .Values.server.llm.existingSecret }}
            - name: HERMES_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.llm.existingSecret | quote }}
                  key: {{ .Values.server.llm.secretKey | default "apiKey" | quote }}
            {{- else if .Values.server.llm.apiKey }}
            - name: HERMES_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-llm
                  key: {{ .Values.server.llm.secretKey | default "apiKey" | quote }}
            {{- end }}
            {{- if .Values.server.llm.model }}
            - name: HERMES_LLM_MODEL
              value: {{ .Values.server.llm.model | quote }}
            {{- end }}
            - name: HERMES_UI_DIR
              value: /app/ui
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 4
          volumeMounts:
            - name: data
              mountPath: /data/hermes
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: hermes-data
          {{- else }}
          emptyDir: {}
          {{- end }}
