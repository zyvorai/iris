{{- if .Values.license.key }}
apiVersion: v1
kind: Secret
metadata:
  name: hermes-license
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  license.key: {{ .Values.license.key | quote }}
{{- end }}
