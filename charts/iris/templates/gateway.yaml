{{- if .Values.gateway.enabled }}
# Gateway API front door served by Setura (https://github.com/zyvorai/zyvor-setura-gateway).
# Install the controller once per cluster:
#   setura gateway install --image ghcr.io/zyvorai/zyvor-setura-gateway:0.7.0 --namespace setura-system | kubectl apply -f -
# The Ingress template stays available; enable this instead of `ingress.enabled`, not as well.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: iris
  labels:
    app.kubernetes.io/name: iris
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.httpPort }}
      allowedRoutes:
        namespaces:
          from: Same
{{- if and .Values.gateway.tls .Values.gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.tls.secretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iris
  labels:
    app.kubernetes.io/name: iris
spec:
  parentRefs:
    - name: iris
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: iris-server
          port: {{ .Values.service.port }}
{{- if .Values.gateway.backendTLS.enabled }}
---
# iris-server terminates TLS itself (self-signed unless IRIS_TLS_CERT/IRIS_TLS_KEY are set);
# verify it against this CA ConfigMap (key ca.crt) with the name the certificate carries.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: iris-server-backend-tls
  labels:
    app.kubernetes.io/name: iris
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: iris-server
  validation:
    hostname: {{ .Values.gateway.backendTLS.hostname | quote }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.gateway.backendTLS.caConfigMap | quote }}
{{- end }}
{{- end }}
