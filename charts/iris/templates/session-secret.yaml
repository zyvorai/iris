apiVersion: v1
kind: Secret
metadata:
  name: iris-session-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: iris
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace "iris-session-secret") -}}
  {{- /* crates/iris-server/src/auth.rs falls back to a hardcoded, publicly-readable
         session-signing key ("iris-dev-session-secret-change-me") whenever
         IRIS_SESSION_SECRET is unset — anyone who has read that source can forge a
         valid session for a deployment that hit the fallback. deployment.yaml previously
         only set the env var when .Values.server.sessionSecret was non-empty, so every
         default Helm install silently used the hardcoded value. Always source it from
         this Secret instead (random, 64 chars, generated on first install and preserved
         across upgrades via the lookup above) so a Helm-deployed iris never falls
         through to the binary's dev default. */}}
  {{- if .Values.server.sessionSecret }}
  session-secret: {{ .Values.server.sessionSecret | b64enc | quote }}
  {{- else }}
  session-secret: {{ if $existingSecret }}{{ index $existingSecret.data "session-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{- end }}
