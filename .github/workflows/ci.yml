name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust ──────────────────────────────────────────────────────────────────
  rust:
    name: Rust (test · clippy · fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ── Go ────────────────────────────────────────────────────────────────────
  go:
    name: Go (test · vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

  # ── UI ────────────────────────────────────────────────────────────────────
  ui:
    name: UI (build · typecheck · lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npx eslint src --max-warnings 0
        continue-on-error: true

  # ── Helm ──────────────────────────────────────────────────────────────────
  helm:
    name: Helm (lint · template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ./charts/iris

      - name: Template render (sanity check)
        run: |
          helm template iris ./charts/iris \
            --set global.domain=ci.test.local \
            --set demoApps.enabled=false \
            --set networkPolicy.enabled=true \
          | grep -c "kind:" | xargs echo "rendered resources:"
