name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: zyvorai

jobs:
  release:
    name: Build · GHCR · Helm · GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push iris-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/iris-server:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/iris-server:latest

      - name: Build and push iris-controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/iris-controller:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/iris-controller:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          helm package ./charts/iris --version "${{ steps.version.outputs.version }}" --app-version "${{ steps.version.outputs.version }}" -d /tmp/helm
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push /tmp/helm/iris-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${{ env.IMAGE_OWNER }}/charts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          ## Iris ${VER}

          Apache License 2.0 — free for lab, PoC, and production use.

          ### Install

          \`\`\`bash
          helm install iris oci://ghcr.io/zyvorai/charts/iris \\
            --version ${VER} \\
            --namespace iris-system --create-namespace \\
            --set controller.publicBaseUrl=https://<node-ip>:31847
          \`\`\`

          Open \`https://<node-ip>:31847\` (self-signed TLS by default).

          ### Images

          - \`ghcr.io/zyvorai/iris-server:${VER}\`
          - \`ghcr.io/zyvorai/iris-controller:${VER}\`

          ### Chart

          - \`oci://ghcr.io/zyvorai/charts/iris\` (version ${VER})
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Iris ${VER}" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "Iris ${VER}" --notes-file "$NOTES" --target "${{ github.sha }}"
          fi
