name: Make GHCR packages public

# One-shot / maintenance: set Iris image + chart packages to public.
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in iris-server iris-controller 'charts/iris'; do
            enc="$(printf '%s' "$pkg" | jq -sRr @uri | tr -d '\n')"
            echo "→ $pkg"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/users/zyvorai/packages/container/${enc}" \
              -f visibility=public
          done
